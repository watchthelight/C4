# <wtl> project: c4 | file: pnpm-workspace.yaml | author: watchthelight </wtl>
packages:
  - "apps/*"

# esbuild's install script only places its platform binary, and electron's downloads the Electron
# build for this platform (skipped with ELECTRON_SKIP_BINARY_DOWNLOAD=1, as the CI lint and test
# jobs do); nothing else may run a script. electron-winstaller comes with electron-builder for the
# Squirrel installer, which C4 does not build, so its script stays off without a warning.
onlyBuiltDependencies:
  - electron
  - esbuild
ignoredBuiltDependencies:
  - electron-winstaller
