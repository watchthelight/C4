# <wtl> project: c4 | file: about.toml | author: watchthelight </wtl>
# cargo-about configuration for scripts/gen_notices.py, which turns `cargo about generate --format json`
# into THIRD-PARTY-NOTICES.md. Only crates that link into the release targets count: build and dev
# dependencies are left out, and so are crates that exist only for other platforms.
#
# `accepted` is a priority list: a crate offered under "Apache-2.0 OR MIT" is taken under MIT because
# MIT comes first. deny.toml holds the same set for `cargo deny check`, with MPL-2.0 limited to the
# crates that need it.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
