# <wtl> project: c4 | file: Cargo.toml | author: watchthelight </wtl>

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/watchthelight/C4"
authors = ["watchthelight <admin@watchthelight.org>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
regex = "1"
notify = "8.2"
sysinfo = "0.39"
rusqlite = { version = "0.41", features = ["bundled"] }
portable-pty = "0.9"
vt100 = "0.18"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
match_same_arms = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
