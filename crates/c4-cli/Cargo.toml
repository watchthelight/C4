# <wtl> project: c4 | file: crates/c4-cli/Cargo.toml | author: watchthelight </wtl>

[package]
name = "c4-cli"
description = "The headless side of C4: c4 sessions, c4 doctor, c4 telemetry, c4 install and c4 uninstall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The headless commands on their own, for development: `cargo run -p c4-cli -- sessions` builds in
# seconds and needs no webview. The `c4` executable (apps/desktop) serves the same commands.
[[bin]]
name = "c4-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
c4-core = { path = "../c4-core" }
c4-discovery = { path = "../c4-discovery" }
c4-transcript = { path = "../c4-transcript" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
c4-testkit = { path = "../c4-testkit" }
tempfile = { workspace = true }

[lints]
workspace = true
