# <wtl> project: c4 | file: .github/workflows/verify.yml | author: watchthelight </wtl>
# Full verification: lint on one runner, then clippy, the whole test suite and the window's build on
# Windows, Linux, macOS arm64 and macOS x64. Runs on every push to main, weekly, and on request.
name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# one group per trigger: the weekly scheduled run must not cancel a push run of the same commit
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # lint and tests need the electron package, not its binary (about 120 MB per platform)
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: headers, slop lint, secret scan
        run: |
          python -I scripts/check_headers.py
          python -I scripts/slop_lint.py
          python -I scripts/scan.py
      - name: python compiles and hook tests
        run: |
          python -m compileall -q scripts
          if [ -d hooks ]; then python -m compileall -q hooks; fi
          if [ -d hooks/tests ]; then python -m unittest discover -s hooks/tests -t .; fi
      # nothing in this job compiles Rust (fmt, deny and about read the sources and the lock file),
      # so the Linux build packages the test job installs are not needed here
      - name: read the toolchain pin
        id: pin
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: cargo-deny and cargo-about (the versions deny.toml and about.toml are written for)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - run: cargo deny check
      - uses: pnpm/action-setup@v6
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v7
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 24
          cache: pnpm
      - name: frontend lint and typecheck
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm -r lint
          pnpm -r typecheck
      - name: third-party notices are current
        run: python -I scripts/gen_notices.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: read the toolchain pin
        id: pin
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: the agents repo, for test M (its installer runs over a file c4 install wrote)
        uses: actions/checkout@v7
        with:
          repository: watchthelight-labs/agents
          ref: a80aa596ee78dabd2f0019efe1b585639833bd32
          path: vendor/agents
          persist-credentials: false
      - run: cargo test --workspace
        env:
          C4_AGENTS_REPO: ${{ github.workspace }}/vendor/agents
      - uses: pnpm/action-setup@v6
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v7
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 24
          cache: pnpm
      - name: frontend tests
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm -r test
      - name: the window builds (the page bundle and the main process)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm -r build
      # the unpacked app with the debug core and shim beside it: electron-builder fetches its own
      # Electron build and tools from GitHub; no certificate on any runner, so no signing lookup
      - name: the app packages (unpacked)
        if: hashFiles('pnpm-lock.yaml') != ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cargo build -p c4-cli -p c4-shim
          python -I scripts/stage_bin.py --profile debug
          pnpm -C apps/desktop package:dir
      - name: what the package holds
        if: hashFiles('pnpm-lock.yaml') != ''
        shell: bash
        run: find apps/desktop/release -maxdepth 4 -not -path '*/locales/*' | sort | head -n 60
      # the unpacked app under Playwright's Electron launcher: the window with the core from its
      # resources against the fixture home, the fold chord, the relay of headless commands. Linux
      # runners have no display, so xvfb; the macOS build is unsigned, and whether it starts there
      # is an open question until this step is green, so that runner's result does not fail the job
      - name: the app runs (playwright over the unpacked app)
        if: hashFiles('apps/desktop/e2e/playwright.config.ts') != ''
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb
            xvfb-run -a pnpm -C apps/desktop e2e
          else
            pnpm -C apps/desktop e2e
          fi
      - name: playwright output, kept when a check failed
        if: always() && hashFiles('apps/desktop/e2e/playwright.config.ts') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
